<!DOCTYPE html>
<!-- build: rynek-gildii-11 -->
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Rynek gildii – Albion Online</title>
<style>
:root{
  --bg:#08081a;--s1:#10102a;--s2:#181838;--s3:#202048;
  --border:#2e2e60;--gold:#c9a84c;--gold-l:#e8c96a;--gold-d:#7a5f20;
  --text:#e0d5c0;--muted:#8080b0;--green:#4caf50;--gbg:rgba(76,175,80,.10);
  --red:#f44336;--rbg:rgba(244,67,54,.10);--blue:#5599ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}

/* HEADER */
#hdr{background:linear-gradient(180deg,#200f00,#0e0600);border-bottom:2px solid var(--gold-d);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:10}
.logo-i{font-size:2rem}
.logo-main{font-size:1rem;font-weight:700;color:var(--gold-l);letter-spacing:1px;text-transform:uppercase}
.logo-sub{font-size:.7rem;color:var(--muted)}
/* Main app sections (calc / guild) */
.main-nav{display:flex;align-items:stretch;background:var(--s1);border:2px solid var(--border);border-radius:12px;padding:5px;gap:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.main-nav-sep{width:2px;background:linear-gradient(180deg,transparent,var(--border),transparent);margin:6px 4px;flex-shrink:0;border-radius:1px}
.main-tab{display:flex;align-items:center;gap:9px;padding:10px 20px;border-radius:9px;border:2px solid transparent;background:transparent;color:var(--muted);font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;user-select:none;letter-spacing:.2px;white-space:nowrap;line-height:1.2}
.main-tab-ico{font-size:1.35rem;line-height:1;flex-shrink:0}
.main-tab-lbl{font-size:.88rem}
.main-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06)}
.main-tab.active{color:var(--gold-l);border-color:var(--gold-d);background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.06));box-shadow:0 0 16px rgba(201,168,76,.18),inset 0 1px 0 rgba(255,255,255,.08)}
.main-tab.active .main-tab-ico{filter:drop-shadow(0 0 6px rgba(201,168,76,.45))}
.main-tab-badge{display:inline-block;background:var(--gold);color:#000;border-radius:999px;padding:1px 7px;font-size:.65rem;font-weight:800;margin-left:2px;vertical-align:middle}
.prem-btn{display:flex;align-items:center;gap:9px;padding:8px 16px;background:var(--s2);border:2px solid var(--border);border-radius:9px;cursor:pointer;transition:all .2s;user-select:none;color:var(--muted)}
.prem-btn:hover{border-color:var(--gold-d);color:var(--text)}
.prem-btn.on{background:linear-gradient(135deg,#3d2500,#4f3200);border-color:var(--gold);color:var(--gold-l);box-shadow:0 0 20px rgba(201,168,76,.25)}
.prem-btn img{height:24px;border-radius:4px;object-fit:cover}
.prem-btn .lbl{font-weight:700;font-size:.9rem}
/* City */
.city-wrap{position:relative}
.city-btn{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--s2);border:2px solid var(--border);border-radius:9px;cursor:pointer;transition:all .2s;user-select:none}
.city-btn:hover,.city-btn.open{border-color:var(--gold-d)}
.city-btn .c-icon{font-size:1.6rem;line-height:1}
.city-btn .c-name{font-size:.9rem;font-weight:600}
.city-btn .c-arr{font-size:.7rem;color:var(--muted);margin-left:4px;transition:transform .2s}
.city-btn.open .c-arr{transform:rotate(180deg)}
#city-panel{position:fixed;top:auto;left:50%;transform:translateX(-50%);background:var(--s1);border:2px solid var(--border);border-radius:14px;padding:16px;z-index:200;width:min(580px,96vw);box-shadow:0 12px 40px rgba(0,0,0,.7);display:none}
#city-panel.open{display:block}
.city-panel-ttl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.city-panel-ttl img{height:20px;filter:drop-shadow(0 0 4px rgba(201,168,76,.5))}
.city-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.city-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;background:var(--s2);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;user-select:none}
.city-tile:hover{border-color:var(--gold-d);background:var(--s3)}
.city-tile.active{background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));border-color:var(--gold)}
.ct-icon{font-size:2.6rem;line-height:1}
.ct-name{font-size:.8rem;font-weight:700;text-align:center;white-space:nowrap}
.ct-count{font-size:.68rem;color:var(--muted)}

/* TABS */
#tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto}
#sticky-top{position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.tab-btn{padding:12px 20px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:.88rem;white-space:nowrap;transition:all .2s;user-select:none}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-pane{display:none;padding:20px}
.tab-pane.active{display:block}
.sec-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px}
.city-ctx{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;margin-bottom:16px;font-size:.82rem;color:var(--muted)}

/* MATERIALS */
.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mat-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px}
.mat-card-ttl{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:7px}
.mat-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:8px 10px;background:rgba(255,255,255,.025);border-radius:8px}
.mat-row:last-child{margin-bottom:0}
.mat-img{width:52px;height:52px;object-fit:contain;border-radius:7px;flex-shrink:0}
.mat-name{flex:1;font-size:.92rem;line-height:1.4}
.mat-inp{width:130px;background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:7px;padding:9px 11px;font-size:.95rem;text-align:right;flex-shrink:0}
.mat-inp:focus{outline:none;border-color:var(--gold)}

/* SETTINGS */
.scard{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:460px;margin-bottom:14px}
.scard-ttl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:14px}
.s-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.s-row:last-child{margin-bottom:0}
.s-row label{flex:1;font-size:.88rem;color:var(--muted)}
.s-row input{width:80px;background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:.88rem;text-align:right}
.s-row input:focus{outline:none;border-color:var(--gold)}
.s-row .unit{font-size:.8rem;color:var(--muted);width:16px}
.hint{font-size:.75rem;color:var(--muted);margin-top:10px;line-height:1.6}
/* Language toggle */
.lang-toggle{display:flex;gap:8px;margin-bottom:14px}
.lang-btn{padding:10px 22px;border-radius:9px;border:2px solid var(--border);background:var(--s2);color:var(--muted);font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s;user-select:none}
.lang-btn:hover{border-color:var(--gold-d);color:var(--text)}
.lang-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));border-color:var(--gold);color:var(--gold-l)}

/* ITEM CARDS */
.items-list{display:flex;flex-direction:column;gap:16px}
.sort-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--s1);border:1px solid var(--border);border-radius:10px}
.sort-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-right:4px;white-space:nowrap}
.sort-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;background:var(--s2);border:1.5px solid var(--border);border-radius:8px;color:var(--muted);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap}
.sort-btn:hover{border-color:var(--gold-d);color:var(--text)}
.sort-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));border-color:var(--gold);color:var(--gold-l)}
.fav-btn{background:transparent;border:1.5px solid var(--border);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:1.15rem;color:var(--muted);transition:all .2s;line-height:1;flex-shrink:0}
.fav-btn:hover{border-color:var(--gold-d);color:var(--gold-l)}
.fav-btn.on{color:#ffd700;border-color:rgba(255,215,0,.55);background:rgba(255,215,0,.1);text-shadow:0 0 8px rgba(255,215,0,.45)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;background:var(--s1);border:2px dashed var(--border);border-radius:12px;cursor:pointer;color:var(--muted);font-size:.95rem;transition:all .2s;user-select:none}
.add-btn:hover{border-color:var(--gold-d);color:var(--gold)}
.item-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.item-top{background:var(--s2);padding:14px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.item-icon{width:90px;height:90px;background:var(--bg);border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden;flex-shrink:0;position:relative}
.item-icon img{width:100%;height:100%;object-fit:contain}
.item-fields{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;flex:1}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.fi{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 10px;font-size:.85rem}
.fi:focus{outline:none;border-color:var(--gold)}
select.fi option{background:var(--s2)}
.item-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;align-self:flex-start;padding-top:4px}
/* Big sell order button */
.so-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--s2);border:2px solid var(--border);border-radius:9px;color:var(--muted);font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap}
.so-btn:hover{border-color:var(--gold-d);color:var(--text)}
.so-btn.on{background:linear-gradient(135deg,rgba(76,175,80,.18),rgba(76,175,80,.06));border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(76,175,80,.22)}
.so-btn input{display:none}
.btn-rm{background:none;border:1px solid rgba(244,67,54,.35);color:var(--red);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:.82rem;transition:all .2s}
.btn-rm:hover{background:rgba(244,67,54,.18)}

/* ITEM BODY */
.item-body{padding:14px 16px}
.range-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.range-lbl{font-size:.85rem;color:var(--muted);font-weight:600}
.rsel{background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:7px;padding:7px 12px;font-size:.88rem;cursor:pointer;font-weight:600}
.rsel:focus{outline:none;border-color:var(--gold)}
.rsel option{background:var(--s2)}
.arr-big{color:var(--gold);font-size:1.3rem;font-weight:700}
.range-info{font-size:.82rem;font-weight:700;border-radius:6px;padding:4px 10px;border:1px solid}
.prices-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
.pg2{display:flex;flex-direction:column;gap:4px;flex:1;min-width:88px}
.pg2 .pl{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.d0{background:#777}.d1{background:#3dbf40}.d2{background:#4488ff}.d3{background:#aa44ff}
.pin{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 9px;font-size:.88rem;width:100%;text-align:right}
.pin:focus{outline:none;border-color:var(--gold)}

/* RESULTS TABLE */
.tbl-wrap{overflow-x:auto;margin-bottom:16px}
.rtbl{width:100%;border-collapse:collapse;font-size:14px;min-width:880px}
.rtbl th{background:rgba(0,0,0,.45);color:var(--muted);padding:10px 11px;text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap}
.rtbl td{padding:10px 11px;border-bottom:1px solid rgba(46,46,96,.5);vertical-align:middle}
.rtbl tr:last-child td{border-bottom:none}
.rtbl tr.rg{background:var(--gbg)}
.rtbl tr.rb{background:var(--rbg)}
.rtbl tr.rdim{opacity:.4}
.pg{color:var(--green);font-weight:700}
.pb{color:var(--red);font-weight:700}
.pn{color:var(--muted);font-style:italic}
.step-l{font-weight:700;white-space:nowrap;font-size:.88rem}
.mat-cell{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mat-cell img{width:32px;height:32px;object-fit:contain;border-radius:5px;background:rgba(255,255,255,.04)}
.mat-cell .mq{color:var(--gold);font-weight:700}
.verdict{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.vy{background:rgba(76,175,80,.2);color:var(--green);border:1px solid rgba(76,175,80,.4)}
.vn{background:rgba(244,67,54,.2);color:var(--red);border:1px solid rgba(244,67,54,.4)}
.vna{background:var(--s3);color:var(--muted);border:1px solid var(--border)}
.rdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:middle}

/* REQUIRED MATERIALS PILLS (in item card) */
.req-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--s2);border:1px solid var(--border);border-radius:9px}
.req-lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap;margin-right:4px}
.req-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px}
.req-pill img{width:26px;height:26px;object-fit:contain}
.req-pill .rp-qty{font-weight:700;color:var(--gold-l);font-size:.92rem}
.req-pill .rp-name{font-size:.82rem;color:var(--muted)}
/* SUMMARY */
.sum-card{background:linear-gradient(135deg,rgba(201,168,76,.07),rgba(201,168,76,.02));border:1.5px solid rgba(201,168,76,.25);border-radius:12px;padding:18px}
.sum-head{font-size:.88rem;font-weight:700;color:var(--gold-l);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sum-badge{font-size:.72rem;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:5px;padding:3px 8px}
.sum-lines{display:flex;flex-direction:column;gap:8px}
.sum-line{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(0,0,0,.2);border-radius:7px}
.sum-line-lbl{flex:1;font-size:.88rem;color:var(--muted)}
.sum-line-val{font-size:.95rem;font-weight:700;white-space:nowrap}
.sum-sep{height:1px;background:rgba(201,168,76,.15);margin:4px 0}
.sum-invest{background:rgba(244,67,54,.08);border:1px solid rgba(244,67,54,.2);border-radius:9px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:4px}
.sum-profit-box{border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.sum-profit-box.good{background:rgba(76,175,80,.1);border:1.5px solid rgba(76,175,80,.35)}
.sum-profit-box.bad{background:rgba(244,67,54,.1);border:1.5px solid rgba(244,67,54,.35)}
.sum-profit-big{font-size:1.3rem;font-weight:700}
.sum-daily{font-size:.82rem;color:var(--muted);margin-left:auto;white-space:nowrap}
.sum-na{color:var(--muted);font-style:italic;font-size:.85rem}

/* BACK TO TOP */
#btn-top,#btn-bot{position:fixed;right:24px;width:46px;height:46px;background:linear-gradient(135deg,var(--s2),var(--s3));border:2px solid var(--gold-d);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:500;font-size:1.1rem;color:var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s,border-color .2s}
#btn-top{bottom:78px}
#btn-bot{bottom:24px}
#btn-top.vis,#btn-bot.vis{opacity:1;pointer-events:auto}
#btn-top:hover,#btn-bot:hover{border-color:var(--gold)}
#btn-top:hover{transform:scale(1.1) translateY(-2px)}
#btn-bot:hover{transform:scale(1.1) translateY(2px)}
@media(max-width:1200px){.mat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.mat-grid{grid-template-columns:1fr}}
/* SEARCH AUTOCOMPLETE */
.search-wrap{position:relative;display:inline-block}
.search-dd{position:absolute;top:100%;left:0;min-width:280px;background:var(--s1);border:1.5px solid var(--border);border-radius:9px;z-index:300;max-height:280px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.sdd-item{padding:7px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid rgba(46,46,96,.5);transition:background .12s}
.sdd-item:last-child{border-bottom:none}
.sdd-item:hover,.sdd-item.focus{background:var(--s2)}
.sdd-item img{width:28px;height:28px;object-fit:contain;border-radius:4px;flex-shrink:0}
.sdd-name{font-size:.86rem;color:var(--text)}
.sdd-msg{padding:12px;text-align:center;color:var(--muted);font-size:.82rem}
/* ADD-TO-SUMMARY / MARKET BUTTONS */
.sum-act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-add-sum{padding:7px 15px;border-radius:8px;border:1.5px solid var(--border);background:var(--s2);color:var(--muted);font-size:.84rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-add-sum:hover{border-color:var(--gold-d);color:var(--text)}
.btn-add-sum.on{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));border-color:var(--gold);color:var(--gold-l)}
.btn-to-market{padding:7px 15px;border-radius:8px;border:1.5px solid rgba(76,175,80,.45);background:rgba(76,175,80,.08);color:#4caf50;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-to-market:hover{background:rgba(76,175,80,.18)}
/* SUMMARY TAB */
.stab-total{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.02));border:1.5px solid rgba(201,168,76,.25);border-radius:12px;padding:16px;margin-bottom:14px;display:flex;gap:12px;flex-wrap:wrap}
.stab-kv{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:160px}
.stab-k{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.stab-v{font-size:1rem;font-weight:700}
.stab-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.stab-card-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:nowrap}
.stab-card-main{flex:1;min-width:0}
.stab-card-icon{flex-shrink:0;order:-1}
.stab-card-icon img{width:120px;height:120px;object-fit:contain;border-radius:12px;background:rgba(0,0,0,.35);padding:8px;display:block}
.stab-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
/* AWAITING TAB */
.await-card{background:var(--s1);border:1.5px solid rgba(76,175,80,.2);border-radius:10px;padding:14px;margin-bottom:10px}
.await-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.await-info{flex:1;min-width:0}
.await-name{font-weight:700;font-size:.95rem}
.await-sub{font-size:.75rem;color:var(--muted);margin-top:2px}
.await-nums{display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap}
.btn-sold{padding:8px 18px;border-radius:8px;border:1.5px solid rgba(76,175,80,.5);background:rgba(76,175,80,.1);color:#4caf50;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-sold:hover{background:rgba(76,175,80,.25)}
/* STATS BOX */
.stats-box{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.stats-head{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats-kv{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stats-k{font-size:.68rem;color:var(--muted);margin-bottom:3px}
.stats-v{font-size:1rem;font-weight:700;color:var(--gold-l)}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
/* TEST BADGE */
.test-badge{display:inline-block;background:#ff5722;color:#fff;font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:4px;margin-left:8px;vertical-align:middle;letter-spacing:.5px}
/* GUILD MARKET */
.gm-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding:12px 14px;background:var(--s1);border:1px solid var(--border);border-radius:10px}
.gm-filters{display:flex;gap:6px;flex-wrap:wrap}
.gm-fbtn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--s2);color:var(--muted);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.gm-fbtn:hover{border-color:var(--gold-d);color:var(--text)}
.gm-fbtn.active{background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(201,168,76,.06));border-color:var(--gold);color:var(--gold-l)}
.gm-search{flex:1;min-width:160px;background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.88rem}
.gm-search:focus{outline:none;border-color:var(--gold)}
.gm-main-tabs{display:flex;gap:0;padding:0 20px;background:var(--s1);border-bottom:1px solid var(--border)}
.gm-mtab{padding:12px 22px;cursor:pointer;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:.9rem;transition:all .2s}
.gm-mtab:hover{color:var(--text)}
.gm-mtab.active{color:var(--gold-l);border-bottom-color:var(--gold)}
.gm-tags-panel{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.gm-tags-hdr{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.gm-tag-search{width:100%;background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.88rem;margin-bottom:8px}
.gm-tag-search:focus{outline:none;border-color:var(--gold)}
.gm-tags{display:flex;flex-wrap:wrap;gap:6px;max-height:min(240px,42vh);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.gm-tags-empty{font-size:.82rem;color:var(--muted);padding:6px 2px}
.gm-tag{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--s2);color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s}
.gm-tag:hover{border-color:var(--gold-d);color:var(--text)}
.gm-tag.active{background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.06));border-color:var(--gold);color:var(--gold-l)}
.gm-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:stretch;flex-wrap:nowrap}
@media(max-width:640px){.gm-card{flex-wrap:wrap}}
.gm-nick-col{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;gap:6px;min-width:100px;flex-shrink:0;padding-left:12px;border-left:1px solid var(--border)}
@media(max-width:640px){.gm-nick-col{width:100%;margin-left:0;border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:10px;align-items:flex-start;text-align:left}}
.gm-nick-big{font-size:1.45rem;font-weight:800;color:var(--gold-l);line-height:1.15;word-break:break-word;max-width:180px}
.gm-nick-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.gm-icon-wrap{flex-shrink:0;border-radius:12px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden}
.gm-icon-wrap.gm-icon-quality{border-style:solid;padding:6px}
.gm-icon-wrap.gm-q-normal{border-color:#7a7a7a}
.gm-icon-wrap.gm-q-good{border-color:#6a8fa8;box-shadow:0 0 0 1px rgba(106,143,168,.35),0 0 8px rgba(106,143,168,.28)}
.gm-icon-wrap.gm-q-outstanding{border-color:#c9782a;box-shadow:0 0 0 1px rgba(201,120,42,.35),0 0 10px rgba(201,120,42,.35)}
.gm-icon-wrap.gm-q-excellent{border-color:#ffffff;box-shadow:0 0 0 1px rgba(255,255,255,.45),0 0 12px rgba(255,255,255,.35)}
.gm-icon-wrap.gm-q-masterpiece{border-color:#ffd700;box-shadow:0 0 0 1px rgba(255,215,0,.5),0 0 14px rgba(255,215,0,.55)}
.gm-icon-wrap.gm-icon-plain{border:none;padding:4px}
.gm-icon-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.gm-icon-lg{width:104px;height:104px}
.gm-icon-lg.gm-icon-quality{border-width:4px}
.gm-icon-preview{width:120px;height:120px;margin-top:10px}
.gm-icon-preview.gm-icon-quality{border-width:4px}
.gm-preview-wrap{margin-top:8px}
.gm-body{flex:1;min-width:200px}
.gm-title{font-weight:700;font-size:1rem;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.gm-meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;align-items:center}
.gm-qty{font-size:1.15rem;font-weight:800;color:var(--text);letter-spacing:.02em}
.gm-price{font-size:1.05rem;font-weight:700;color:var(--gold-l)}
.gm-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:700;text-transform:uppercase}
.gm-badge.sell{background:rgba(76,175,80,.15);color:#4caf50;border:1px solid rgba(76,175,80,.4)}
.gm-badge.buy{background:rgba(85,153,255,.15);color:#5599ff;border:1px solid rgba(85,153,255,.4)}
.gm-q-pill{display:inline-block;padding:2px 10px;border-radius:6px;font-size:.76rem;font-weight:700;border:1.5px solid}
.gm-q-pill.gm-q-normal{border-color:#7a7a7a;color:#b0b0b0}
.gm-q-pill.gm-q-good{border-color:#6a8fa8;color:#9ec4dc}
.gm-q-pill.gm-q-outstanding{border-color:#c9782a;color:#e8a55a}
.gm-q-pill.gm-q-excellent{border-color:#ffffff;color:#ffffff}
.gm-q-pill.gm-q-masterpiece{border-color:#ffd700;color:#ffd700}
.gm-nick{color:var(--gold);font-weight:600}
.gm-note-text{font-size:.88rem;color:#d4cfe8;margin-top:6px;line-height:1.45}
.gm-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.gm-form{background:var(--s1);border:1.5px solid rgba(201,168,76,.35);border-radius:12px;padding:16px;margin-bottom:16px}
.gm-form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.gm-status{font-size:.82rem;color:var(--muted);min-height:18px;margin-bottom:8px}
#gm-sdd .sdd-item{padding:10px 14px;gap:14px}
#gm-sdd .sdd-item img{width:80px;height:80px;border-radius:8px}
#gm-sdd .sdd-name{font-size:.92rem}
</style>

function emptyMats(){return Object.fromEntries(TIERS.map(t=>[t,{rune:'',soul:'',relic:''}]));}
function isEmptyMatVal(v){return v===''||v==null||v===undefined;}
function mergeCityMats(cloudM,localM,preferLocal=false){
  const out={};
  TIERS.forEach(tier=>{
    out[tier]={rune:'',soul:'',relic:''};
    MAT_TYPES.forEach(m=>{
      const cv=cloudM?.[tier]?.[m],lv=localM?.[tier]?.[m];
      const ce=isEmptyMatVal(cv),le=isEmptyMatVal(lv);
      if(ce&&le)out[tier][m]='';
      else if(ce)out[tier][m]=String(lv);
      else if(le)out[tier][m]=String(cv);
      else out[tier][m]=preferLocal?String(lv):String(cv);
    });
  });
  return out;
}
function mergeListings(a=[],b=[]){
  const map=new Map();
  [...(a||[]),...(b||[])].forEach(l=>{
    if(!l||l.id==null)return;
    const k=String(l.id),prev=map.get(k);
    if(!prev||(l.listedAt||0)>=(prev.listedAt||0))map.set(k,l);
  });
  return [...map.values()];
}
function mergeSalesHistory(a=[],b=[]){
  const map=new Map();
  [...(a||[]),...(b||[])].forEach(s=>{
    if(!s)return;
    const k=`${s.id||''}_${s.soldAt||0}_${s.name||''}_${s.profit||0}`;
    map.set(k,s);
  });
  return [...map.values()];
}
function mergeItemsByCity(local={},cloud={}){
  const out={};
  CITY_LIST.forEach(c=>{
    const map=new Map();
    [...(cloud?.[c]||[]),...(local?.[c]||[])].forEach(item=>{
      if(!item||item.id==null)return;
      const prev=map.get(item.id);
      map.set(item.id,prev?{...prev,...item}:item);
    });
    out[c]=[...map.values()];
  });
  return out;
}
function mergeMaterialsByCity(local={},cloud={},localTs,cloudTs){
  const preferLocal=localTs>=cloudTs;
  const out={};
  CITY_LIST.forEach(c=>{
    out[c]=mergeCityMats(cloud?.[c],local?.[c],preferLocal);
  });
  return out;
}
function mergeCloudIntoLocal(cloudData,cloudUpdatedAt){
  if(!cloudData)return;
  const local=JSON.parse(localStorage.getItem('ao_ec_v7')||'{}');
  const localTs=local.updated_at_ts||0;
  const cloudTs=Math.max(cloudData.updated_at_ts||0,cloudUpdatedAt?new Date(cloudUpdatedAt).getTime():0);
  const preferLocal=localTs>=cloudTs;
  const merged={
    lang:preferLocal?(local.lang??cloudData.lang):(cloudData.lang??local.lang),
    premium:preferLocal?!!local.premium:!!cloudData.premium,
    activeCity:local.activeCity??cloudData.activeCity??'Bridgewatch',
    activeTab:local.activeTab??cloudData.activeTab??'items',
    mainSection:local.mainSection??cloudData.mainSection??'calc',
    settings:{...(cloudData.settings||{}),...(local.settings||{})},
    sort:local.sort??cloudData.sort??{key:'none',dir:'asc'},
    nextId:Math.max(local.nextId||1,cloudData.nextId||1),
    nextListingId:Math.max(local.nextListingId||1,cloudData.nextListingId||1),
    listings:mergeListings(local.listings,cloudData.listings),
    salesHistory:mergeSalesHistory(local.salesHistory,cloudData.salesHistory),
    itemsByCity:mergeItemsByCity(local.itemsByCity,cloudData.itemsByCity),
    materialsByCity:mergeMaterialsByCity(local.materialsByCity,cloudData.materialsByCity,localTs,cloudTs),
    updated_at_ts:Math.max(localTs,cloudTs,Date.now())
  };
  localStorage.setItem('ao_ec_v7',JSON.stringify(merged));
}

function guildItemRenderKey(entry){

  const tier=(entry.tier||'T4').toUpperCase();
  const base=normalizeItemBase(entry.unique_base_name,tier);

function isNonQualityMaterial(baseName){
  if(!baseName)return true;
  const b=baseName.toUpperCase();
  if(/^(ORE|HIDE|FIBER|WOOD|ROCK|PLANKS|METALBAR|STONEBLOCK|REFINED|RAW)/.test(b))return true;
  if(/POTION|FOOD|MEAL|FISH|BREAD|OMELETTE|TOME|STUFFED|WHEAT|BEAN|CARROT|SALAD|SEED|TRACKING|TRACKINGITEM|WILDLIFE|ALCHEMY_COMMON|ALCHEMY_RARE/i.test(b)&&!/^(MAIN_|2H_|OFF_|HEAD_|ARMOR_|SHOES_|GATHERER_)/.test(b))return true;
  if(!/^(MAIN_|2H_|OFF_|HEAD_|ARMOR_|SHOES_|GATHERER_|BAG|CAPE)/.test(b)&&/(ORE|HIDE|FIBER|WOOD|ROCK|PLANK|METALBAR|STONEBLOCK)/i.test(b))return true;
  return false;
}
function itemHasResourceEnchant(baseName){
  if(!baseName)return false;
  const b=normalizeItemBase(baseName,'T4');
  if(/^(MAIN_|2H_|OFF_|HEAD_|ARMOR_|SHOES_|GATHERER_)/.test(b))return false;
  if(/^BAG|^CAPE/.test(b))return false;
  if(/POTION|FOOD|MEAL|FISH|BREAD|OMELETTE|TOME|STUFFED|WHEAT|BEAN|CARROT|SALAD|SEED|HORSE|OX|DIREWOLF|STAG|COUGAR|DONKEY|MULE|RAM|TOOL|SICKLE|SKINNING|MINING|LOGGING|QUARRY|FISHING|TRACKING|TRACKINGITEM|WILDLIFE|ALCHEMY_COMMON|ALCHEMY_RARE|ALCHEMY_EXTRACT|FISHSAUCE|BLOODBROTH|ALCOHOL/i.test(b))return false;
  return /(ORE|HIDE|FIBER|WOOD|ROCK|PLANKS|METALBAR|STONEBLOCK|BLOCK|REFINED|CLOTH|LEATHER|POWDER|RUNE|SOUL|RELIC)/i.test(b);
}
function itemHasGearEnchant(baseName){
  if(!baseName)return false;
  const b=normalizeItemBase(baseName,'T4');
  if(b.startsWith('BAG')||b.startsWith('CAPE'))return false;
  if(b.startsWith('2H_')||b.startsWith('MAIN_')||b.startsWith('OFF_'))return true;
  if(b.startsWith('HEAD_')||b.startsWith('ARMOR_')||b.startsWith('SHOES_'))return true;
  if(b.startsWith('GATHERER_'))return true;
  return false;

function itemHasEnchant(baseName){

}
function guildMaxEnchantLevel(baseName){

  return 0;
}
function guildEnchantLevels(baseName){
  if(!itemHasEnchant(baseName))return [];
  const top=guildMaxEnchantLevel(baseName);

}
function itemHasQuality(baseName,tier){
  if(!baseName||isNonQualityMaterial(baseName))return false;
  const b=baseName.toUpperCase();
  if(b.startsWith('2H_')||b.startsWith('MAIN_')||b.startsWith('OFF_'))return true;
  if(b.startsWith('HEAD_')||b.startsWith('ARMOR_')||b.startsWith('SHOES_'))return true;
  if(b.startsWith('GATHERER_'))return true;
  if(b.startsWith('BAG')||b.startsWith('CAPE'))return true;

}

async function changeGuildUserNick(oldNick,newNick,ip,guildTag){
  const oldKey=nickKey(oldNick);
  const newKey=nickKey(newNick);
  const display=(newNick||'').trim();
  if(!newKey)return{ok:false,msg:'gm_profile_nick_required'};
  if(newKey===oldKey){
    await touchGuildUser(display,ip,guildTag);
    return{ok:true};
  }
  const taken=await fetchGuildUserRow(`nick_key=eq.${encodeURIComponent(newKey)}`);
  if(taken)return{ok:false,msg:'gm_nick_busy'};
  const me=await fetchGuildUserRow(`nick_key=eq.${encodeURIComponent(oldKey)}`);
  if(me&&me.ip!==ip)return{ok:false,msg:'gm_login_nick_taken'};
  const body={
    nick_key:newKey,
    nick_display:display,
    guild_tag:(guildTag||'').trim()||null,
    updated_at:new Date().toISOString()
  };
  try{
    if(me){
      const r=await fetch(`${SB_URL}/rest/v1/${SB_USERS_TABLE}?nick_key=eq.${encodeURIComponent(oldKey)}&ip=eq.${encodeURIComponent(ip)}`,{
        method:'PATCH',headers:sbH(),body:JSON.stringify(body)
      });

      if(r.status===409)return{ok:false,msg:'gm_nick_busy'};
      return{ok:false,msg:'gm_login_verify_fail'};

}

async function getClientIp(){
  if(_cachedClientIp)return _cachedClientIp;
  const tryJson=async url=>{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    return (j.ip||'').trim()||null;
  };
  const tryText=async url=>{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)return null;
    return (await r.text()).trim()||null;
  };
  const tryCfTrace=async()=>{
    const r=await fetch('https://www.cloudflare.com/cdn-cgi/trace',{cache:'no-store'});
    if(!r.ok)return null;
    const t=await r.text();
    const m=t.match(/^ip=(.+)$/m);
    return m?m[1].trim():null;
  };
  for(const fn of[
    ()=>tryJson('https://api64.ipify.org?format=json'),
    ()=>tryJson('https://api.ipify.org?format=json'),
    ()=>tryCfTrace(),
    ()=>tryText('https://api64.ipify.org'),
    ()=>tryText('https://api.ipify.org'),
  ]){
    try{
      const ip=await fn();
      if(ip&&ip.length<=45&&/^[\d.a-fA-F:]+$/.test(ip)){_cachedClientIp=ip;return ip;}
    }catch(_){}
  }
  return null;
}

      if(!cbase&&!listingMatchBase(l).trim())return false;

      const tag=GM_TAGS.find(x=>x.id===guildTagFilter);
      if(tag&&!tag.match(cbase))return false;
    }else{
      const tq=guildTagSearch.trim();
      if(tq){
        const matchTags=tagsMatchingQuery(tq);
        if(matchTags.length&&!matchTags.some(tag=>tag.match(cbase)))return false;

    const nm=listingDisplayName(l).toLowerCase();
    const legacy=(l.item_name||'').toLowerCase();
    const nmEn=(l.item_name_en||'').toLowerCase();
    const nmPl=(l.item_name_pl||'').toLowerCase();

           (l.nick||'').toLowerCase().includes(q)||
           listingGuildTag(l).toLowerCase().includes(q)||

async function saveGuildListing(payload,isUpdate,id){

  if(isNickBanned(cloudNick)){guildStatus=t('gm_banned');return false;}

    if(clientIp)payload.creator_ip=clientIp;
  }else{
    delete payload.creator_ip;
  }
  const softOptional=['guild_tag','item_name_pl','item_name_en'];
  const savedCreatorIp=payload.creator_ip;
  async function pushToCloud(body){
    if(isUpdate&&id!=null){
      return fetch(`${SB_URL}/rest/v1/${SB_GUILD_TABLE}?id=eq.${id}`,{method:'PATCH',headers:sbH(),body:JSON.stringify(body)});
    }

    });
  }

    let body={...payload};

    if(!r.ok&&softOptional.some(k=>body[k]!=null)){
      body={...payload};
      softOptional.forEach(k=>delete body[k]);
      r=await pushToCloud(body);
    }
    if(!r.ok&&savedCreatorIp&&!isUpdate){
      body={...payload};
      softOptional.forEach(k=>delete body[k]);
      body.creator_ip=savedCreatorIp;
      r=await pushToCloud(body);
    }
    if(r.ok){
      await ensureGuildUserProfile();
      await loadGuildMarket();
      guildStatus=t('gm_saved');
      return true;
    }
    console.warn('guild_market save',r.status,await r.text().catch(()=>''));
  }catch(_){}
  if(isUpdate&&id!=null){
    const idx=guildListings.findIndex(x=>String(x.id)===String(id));
    if(idx>=0)guildListings[idx]={...guildListings[idx],...payload};
  }else{
    guildListings.unshift({id:nextGuildLocalId++,...payload});
  }
  localStorage.setItem(GM_LS_KEY,JSON.stringify(guildListings));
  guildStatus=t('gm_saved');
  return true;
}
async function deleteGuildListing(id){
  if(cloudNick&&isNickBanned(cloudNick)){guildStatus=t('gm_banned');return;}
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${SB_GUILD_TABLE}?id=eq.${id}`,{method:'DELETE',headers:sbH()});
    if(r.ok){await loadGuildMarket();guildStatus=t('gm_deleted');return;}
  }catch(_){}
  guildListings=guildListings.filter(x=>String(x.id)!==String(id));
  localStorage.setItem(GM_LS_KEY,JSON.stringify(guildListings));
  guildStatus=t('gm_deleted');
}

const _gmSearchTimer={};
async function triggerGuildSearch(inp,ddId='gm-sdd',tierId='gm-tier'){
  const query=inp.value.trim();
  const dd=document.getElementById(ddId);
  if(!dd)return;
  if(query.length<2){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML=`<div class="sdd-msg">${t('search_searching')}</div>`;
  clearTimeout(_gmSearchTimer.t);
  _gmSearchTimer.t=setTimeout(async()=>{
    const tierEl=document.getElementById(tierId);
    const formTier=tierEl?tierEl.value:(tierId==='prof-tier'?profForm.tier:guildForm.tier);
    if(!_itemDB)dd.innerHTML=`<div class="sdd-msg">${t('search_loading')}</div>`;
    const db=await getItemDB();
    if(!db||!Object.keys(db).length){dd.innerHTML=`<div class="sdd-msg">${t('search_err')}</div>`;return;}
    const q=query.toLowerCase(),hits=[];
    for(const [uname,names] of Object.entries(db)){
      const tm=uname.match(/^T([1-8])_/);
      if(!tm)continue;
      const en=(names.en||'').toLowerCase(),pl=(names.pl||'').toLowerCase();
      if(!en.includes(q)&&!pl.includes(q))continue;
      const display=state.lang==='pl'?(names.pl||names.en||uname):(names.en||names.pl||uname);
      const itemTier='T'+tm[1];
      let score=(en.startsWith(q)||pl.startsWith(q))?2:(en.includes(' '+q)||pl.includes(' '+q))?1:0;
      if(itemTier===formTier)score+=3;
      hits.push({uname,display,score,tier:itemTier,names});
    }
    if(!hits.length){dd.innerHTML=`<div class="sdd-msg">${t('search_none')}</div>`;return;}
    hits.sort((a,b)=>b.score-a.score||a.display.localeCompare(b.display,'pl'));
    dd.innerHTML=hits.slice(0,16).map(h=>{
      const iUrl=`https://render.albiononline.com/v1/item/${encodeURIComponent(h.uname)}.png`;
      return`<div class="sdd-item" data-gm-pick="${esc(h.uname)}" data-gm-dname="${esc(h.display)}" data-gm-tier="${esc(h.tier)}">
        <img src="${iUrl}" alt="" onerror="this.style.display='none'">
        <span class="sdd-name">${esc(h.display)}</span>
      </div>`;
    }).join('');
    dd.querySelectorAll('.sdd-item').forEach(el=>el.addEventListener('mousedown',e=>{
      e.preventDefault();
      const uname=el.dataset.gmPick,dname=el.dataset.gmDname;
      const pickTier=el.dataset.gmTier||formTier;
      const base=uname.replace(/^T\d+_/,'');
      const rowHits=hits.find(h=>h.uname===uname);
      const names=rowHits?.names||{};
      const plN=(names.pl||names.en||dname).trim();
      const enN=(names.en||names.pl||dname).trim();
      if(tierId==='prof-tier'){
        profForm.item_name=state.lang==='pl'?plN:enN;
        profForm.unique_base_name=base;
        profForm.tier=pickTier;
        if(!itemHasQuality(base,pickTier))profForm.enchant=0;
      }else{
        guildForm.item_name_pl=plN;
        guildForm.item_name_en=enN;
        guildForm.item_name=state.lang==='pl'?plN:enN;
        guildForm.unique_base_name=normalizeItemBase(base,pickTier);
        guildForm.tier=pickTier;
        syncGuildFormQualityFlags();
      }
      inp.value=dname;
      dd.style.display='none';
      render();
    }));
  },350);
}

// ══════════ CALC ══════════
function getTaxRate(item){
  const sale=state.premium?+state.settings.taxPrem:+state.settings.taxNoPrem;
  const setup=item.sellOrder?+state.settings.setupFee:0;
  return {sale,setup,total:sale+setup};
}
function calcStep(item,step,mats){
  const bp=parseFloat(item.prices[`p${step}`])||0;
  const sp=parseFloat(item.prices[`p${step+1}`])||0;
  if(!bp||!sp)return null;
  const ti=ITEM_TYPE_KEYS[item.type]||ITEM_TYPE_KEYS['1h'];
  const N=ti.n, mt=STEP_MAT[step];
  const mp=parseFloat((mats[item.tier]||{})[mt])||0;
  const qty=parseInt(item.qty)||1;
  const tax=getTaxRate(item);
  const taxAmt=sp*tax.total/100;
  const matCost=N*mp;
  const profit=(sp-taxAmt)-bp-matCost;
  const dv=parseFloat(item.dailyVol)||0;
  return{step,mt,N,mp,matCost,bp,sp,taxRate:tax.total,taxSale:tax.sale,taxSetup:tax.setup,
    taxAmt,taxAmtQty:taxAmt*qty,netSell:sp-taxAmt,profit,profitQty:profit*qty,qty,
    recDaily:dv>0?Math.max(1,Math.round(dv*.2)):null,hasDailyVol:dv>0};
}
function calcSummary(item,mats){
  const from=+item.rangeFrom,to=+item.rangeTo;
  if(from>=to)return null;
  const bp=parseFloat(item.prices[`p${from}`])||0;
  const sp=parseFloat(item.prices[`p${to}`])||0;
  if(!bp||!sp)return null;
  const ti=ITEM_TYPE_KEYS[item.type]||ITEM_TYPE_KEYS['1h'];
  const N=ti.n,qty=parseInt(item.qty)||1;
  const tax=getTaxRate(item);
  const mc={rune:0,soul:0,relic:0};
  let totalMC=0;
  for(let s=from;s<to;s++){
    const mt=STEP_MAT[s];const mp=parseFloat((mats[item.tier]||{})[mt])||0;
    mc[mt]+=N;totalMC+=N*mp;
  }
  const taxAmt=sp*tax.total/100,netSell=sp-taxAmt;
  const profit=netSell-bp-totalMC;
  const dv=parseFloat(item.dailyVol)||0;
  return{from,to,N,qty,mc,totalMC,bp,sp,taxRate:tax.total,taxSale:tax.sale,taxSetup:tax.setup,
    taxAmt,taxAmtQty:taxAmt*qty,netSell,profit,profitQty:profit*qty,
    totalBuy:bp*qty,totalSell:netSell*qty,totalCost:(bp+totalMC)*qty,
    recDaily:dv>0?Math.max(1,Math.round(dv*.2)):null,hasDailyVol:dv>0};
}

function sortItems(items){
  const mats=getMats();
  const {key,dir}=state.sort;
  if(key==='favorite'){
    return[...items].sort((a,b)=>{
      const fa=a.favorite?1:0, fb=b.favorite?1:0;
      return dir==='asc'?fb-fa:fa-fb;
    });
  }
  if(key==='none')return items;
  const TIER_ORDER=['T2','T3','T4','T5','T6','T7','T8'];
  const scored=items.map(item=>{
    const sum=calcSummary(item,mats);
    const fee=sum&&item.sellOrder?sum.sp*(state.settings.setupFee/100)*sum.qty:0;
    const inv=sum?sum.totalMC*sum.qty+sum.bp*sum.qty+fee:0;
    const roi=inv>0&&sum?sum.profitQty/inv:0;
    const tierIdx=TIER_ORDER.indexOf(item.tier);
    return{item,inv,roi,tierIdx};
  });
  scored.sort((a,b)=>{
    let v=0;
    if(key==='tier')    v=a.tierIdx-b.tierIdx;
    if(key==='roi')     v=a.roi-b.roi;
    if(key==='invest')  v=a.inv-b.inv;
    return dir==='asc'?v:-v;
  });
  return scored.map(s=>s.item);
}

        <span style="font-weight:700;color:var(--gold-l)">${f(sum.mc[m]*sum.qty)}×</span>
        <span style="font-size:.78rem;color:var(--muted)">${tMatFull(item.tier,m)}</span>
      </span>`;
    }).join('');
    return`<div class="stab-card">
      <div class="stab-card-row">
        ${finalIconUrl?`<div class="stab-card-icon"><img src="${esc(finalIconUrl)}" alt="" onerror="this.parentElement.style.display='none'"></div>`:''}
        <div class="stab-card-main">
          <div class="stab-head" style="margin-bottom:8px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:1rem;margin-bottom:3px">${esc(item.name||tType(item.type))}</div>
              <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">
                <span style="color:${tc};font-weight:600">${item.tier}${ENC[from]}→${item.tier}${ENC[to]}</span>
                <span class="sum-badge">× ${item.qty} ${pl?'szt.':'units'}</span>
                <span class="sum-badge">${tQ(item.quality)}</span>
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              <button class="btn-to-market" data-tomarket="${item.id}">🏪 ${t('btn_to_market')}</button>
              <button class="btn-rm" data-rmsum="${item.id}">✕</button>
            </div>
          </div>
          ${sum?`<div class="stab-grid" style="margin-bottom:8px">
            <div class="stab-kv"><div class="stab-k">${pl?'Inwestycja':'Investment'}</div><div class="stab-v" style="color:var(--red)">${f(inv)} 💰</div></div>
            <div class="stab-kv"><div class="stab-k">${pl?'Zarobek':'Profit'}</div><div class="stab-v ${sum.profitQty>=0?'pg':'pb'}">${fp(sum.profitQty)} 💰</div></div>
            <div class="stab-kv"><div class="stab-k">${pl?'Cena sprzedaży':'Sell price'}</div><div class="stab-v">${f(sum.sp)} 💰</div></div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">${matPills||`<span style="font-size:.8rem;color:var(--muted)">${pl?'brak danych':'no data'}</span>`}</div>`
          :`<span class="sum-na">${t('fill_prices')}</span>`}
        </div>
      </div>
    </div>`;
  }).join(''):`<div class="pn" style="padding:24px;text-align:center">${t('sum_tab_empty')}</div>`;
  return`<div class="tab-pane${active?' active':''}"><div style="padding:16px">${totals}${rows}</div></div>`;
}

function buildAwaitingTab(){
  const pl=state.lang==='pl';
  const active=state.activeTab==='awaiting';
  const now=Date.now(),day=86400000,week=7*day,month=30*day;
  const city=state.activeCity;
  const cityData=CITIES[city];
  const sh=state.salesHistory;
  const shCity=sh.filter(s=>s.city===city);
  // Global stats
  const pToday=sh.filter(s=>now-s.soldAt<day).reduce((a,s)=>a+s.profit,0);
  const pWeek =sh.filter(s=>now-s.soldAt<week).reduce((a,s)=>a+s.profit,0);
  const pMonth=sh.filter(s=>now-s.soldAt<month).reduce((a,s)=>a+s.profit,0);
  const pAll  =sh.reduce((a,s)=>a+s.profit,0);
  // City stats
  const cpToday=shCity.filter(s=>now-s.soldAt<day).reduce((a,s)=>a+s.profit,0);
  const cpWeek =shCity.filter(s=>now-s.soldAt<week).reduce((a,s)=>a+s.profit,0);
  const cpMonth=shCity.filter(s=>now-s.soldAt<month).reduce((a,s)=>a+s.profit,0);
  const cpAll  =shCity.reduce((a,s)=>a+s.profit,0);
  const statsHtml=`<div class="stats-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="stats-head" style="margin-bottom:0">${t('stats_title')}</div>
      <button class="btn-rm" id="btn-clear-stats" style="font-size:.78rem;padding:4px 10px">${pl?'🗑️ Wyczyść statystyki':'🗑️ Clear stats'}</button>
    </div>
    <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px">${pl?'🌍 Ogólnie':'🌍 Overall'}</div>
    <div class="stats-grid" style="margin-bottom:12px">
      <div class="stats-kv"><div class="stats-k">${t('stats_today')}</div><div class="stats-v">${fp(pToday)} 💰</div></div>
      <div class="stats-kv"><div class="stats-k">${t('stats_week')}</div><div class="stats-v">${fp(pWeek)} 💰</div></div>
      <div class="stats-kv"><div class="stats-k">${t('stats_month')}</div><div class="stats-v">${fp(pMonth)} 💰</div></div>
      <div class="stats-kv"><div class="stats-k">${t('stats_all')}</div><div class="stats-v">${fp(pAll)} 💰</div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${cityData?.color||'var(--muted)'}">${cityData?.icon||''} ${city}</div>
      <button class="btn-rm" id="btn-clear-city-stats" style="font-size:.72rem;padding:3px 9px">${pl?'🗑️ Wyczyść miasto':'🗑️ Clear city'}</button>
    </div>
    <div class="stats-grid">
      <div class="stats-kv"><div class="stats-k">${t('stats_today')}</div><div class="stats-v">${fp(cpToday)} 💰</div></div>
      <div class="stats-kv"><div class="stats-k">${t('stats_week')}</div><div class="stats-v">${fp(cpWeek)} 💰</div></div>
      <div class="stats-kv"><div class="stats-k">${t('stats_month')}</div><div class="stats-v">${fp(cpMonth)} 💰</div></div>
      <div class="stats-kv"><div class="stats-k">${t('stats_all')}</div><div class="stats-v">${fp(cpAll)} 💰</div></div>
    </div>
  </div>`;
  const listings=getCityListings(city);
  const totValH=listings.length?`<div class="stab-total">
    <div class="stab-kv"><div class="stab-k">${t('await_total_value')}</div><div class="stab-v">${f(listings.reduce((a,l)=>a+l.sp*l.qty,0))} 💰</div></div>
    <div class="stab-kv"><div class="stab-k">${t('await_total_profit')}</div><div class="stab-v ${listings.reduce((a,l)=>a+l.profit,0)>=0?'pg':'pb'}">${fp(listings.reduce((a,l)=>a+l.profit,0))} 💰</div></div>
  </div>`:'';
  const listHtml=listings.length?listings.map(l=>{
    const elapsed=now-l.listedAt;
    const h=Math.floor(elapsed/3600000),m=Math.floor((elapsed%3600000)/60000);
    const timeStr=h>0?`${h}h ${m}m`:`${m}m`;
    const tc=TIER_C[l.tier]||'#aaa';
    const iconH=l.iconUrl?`<img src="${esc(l.iconUrl)}" style="width:72px;height:72px;object-fit:contain" alt="" onerror="this.style.display='none'">`:esc(l.emoji||'📦');

    return`<div class="await-card">
      <div class="await-head">
        <span style="font-size:1.4rem;line-height:1;flex-shrink:0">${iconH}</span>
        <div class="await-info">
          <div class="await-name" style="display:flex;align-items:center;gap:7px">
            ${esc(l.name)}
            ${cityData?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;color:${cityColor};background:rgba(0,0,0,.3);border:1px solid ${cityColor}44;border-radius:5px;padding:2px 7px">${cityData.icon} ${esc(l.city)}</span>`:''}
          </div>
          <div class="await-sub"><span style="color:${tc}">${l.tier}${l.enc}</span> · × ${l.qty} ${pl?'szt.':'units'} · ${t('listed_at')} ${timeStr} ${pl?'temu':'ago'}</div>
        </div>
        <div class="await-nums">
          <div style="font-size:.85rem;color:var(--muted)">${pl?'Wartość':'Value'}: <strong style="color:var(--text)">${f(l.sp*l.qty)} 💰</strong></div>
          <div style="font-size:.85rem;color:var(--muted)">${pl?'Zarobek':'Profit'}: <strong class="${l.profit>=0?'pg':'pb'}">${fp(l.profit)} 💰</strong></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">

        </div>
      </div>
    </div>`;
  }).join(''):`<div class="pn" style="padding:20px;text-align:center">${t('await_tab_empty')}</div>`;
  return`<div class="tab-pane${active?' active':''}"><div style="padding:16px">${statsHtml}${totValH}${listHtml}</div></div>`;
}

function buildResults(item){
  const mats=getMats();
  const steps=[0,1,2].map(s=>calcStep(item,s,mats));
  const sum=calcSummary(item,mats);
  const from=+item.rangeFrom,to=+item.rangeTo;
  const anyStep=steps.some(Boolean);
  const showDly=steps.some(s=>s&&s.hasDailyVol);
  const qty=parseInt(item.qty)||1;
  const tax=getTaxRate(item);
  const ti=ITEM_TYPE_KEYS[item.type]||ITEM_TYPE_KEYS['1h'];

  const tableHtml=`<div class="tbl-wrap">
    <table class="rtbl">
      <thead><tr>
        <th>${t('th_step')}</th>
        <th>${t('th_mat')}</th>
        <th>${t('th_mat_price')}</th>
        <th>${t('th_mat_cost')}</th>
        <th>${t('th_buy')}</th>
        <th>${t('th_sell')}</th>
        <th>${t('th_tax_u')} (${tax.sale}%${tax.setup>0?'+'+tax.setup+'%':''})</th>
        <th>${t('th_tax_t')} ×${qty}</th>
        <th>${t('th_p_u')}</th>
        <th>${t('th_p_t')} ${qty}</th>
        ${showDly?`<th>${t('th_daily')}</th>`:''}
        <th>${t('th_worth')}</th>
      </tr></thead>
      <tbody>
        ${[0,1,2].map(step=>{
          const inRange=step>=from&&step<to;
          const r=steps[step];
          const sl=`${item.tier}${ENC[step]}→${ENC[step+1]}`;
          const mimg=`<img src="${matImg(item.tier,STEP_MAT[step])}" alt="" onerror="this.style.display='none'">`;
          if(!r)return`<tr class="${inRange?'rn':'rdim'}">
            <td><span class="step-l" style="color:${STEP_COL[step]}">${inRange?'<span class="rdot"></span>':''}${sl}</span></td>
            <td class="mat-cell">${mimg}<span>${tMat(STEP_MAT[step])}</span></td>
            <td class="pn">—</td><td class="pn">—</td><td class="pn">—</td><td class="pn">—</td>
            <td class="pn">—</td><td class="pn">—</td><td class="pn">—</td><td class="pn">—</td>
            ${showDly?'<td class="pn">—</td>':''}
            <td><span class="verdict vna">${t('no_data')}</span></td>
          </tr>`;
          const g=r.profit>=0;
          return`<tr class="${inRange?(g?'rg':'rb'):'rdim'}">
            <td><span class="step-l" style="color:${STEP_COL[step]}">${inRange?'<span class="rdot"></span>':''}${sl}</span></td>
            <td class="mat-cell">${mimg}<div><span class="mq">${r.N*qty}×</span> ${tMatFull(item.tier,r.mt)}</div></td>
            <td>${f(r.mp)}</td><td>${f(r.matCost)}</td>
            <td>${f(r.bp)}</td><td>${f(r.sp)}</td>
            <td class="pb">${f(r.taxAmt)}</td><td class="pb">${f(r.taxAmtQty)}</td>
            <td class="${g?'pg':'pb'}">${fp(r.profit)}</td>
            <td class="${g?'pg':'pb'}">${fp(r.profitQty)}</td>
            ${showDly?`<td style="color:var(--gold);font-weight:700">${r.recDaily!=null?r.recDaily+t('s_per_day'):'—'}</td>`:''}
            <td><span class="verdict ${inRange?(g?'vy':'vn'):'vna'}">${inRange?(g?'✓':'✗'):'—'}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  if(!anyStep)return`<div class="pn" style="padding:6px 0">${t('fill_prices')}</div>`;
  return tableHtml+buildSummary(item,sum);
}

function buildSummary(item,sum){
  const from=+item.rangeFrom,to=+item.rangeTo;
  const pl=state.lang==='pl';
  if(!sum)return`<div class="sum-card"><span class="sum-na">${t('fill_range')} ${item.tier}${ENC[from]}→${item.tier}${ENC[to]},${t('to_see_sum')}</span></div>`;

  // Separate components
  const matCostTotal  = sum.totalMC * sum.qty;
  const baseCostTotal = sum.bp * sum.qty;
  const setupFeeTotal = item.sellOrder ? sum.sp * (state.settings.setupFee/100) * sum.qty : 0;
  const salesTaxTotal = sum.sp * (state.premium ? state.settings.taxPrem : state.settings.taxNoPrem) / 100 * sum.qty;
  const investment    = matCostTotal + baseCostTotal + setupFeeTotal;
  const grossRevenue  = sum.sp * sum.qty;
  const netRevenue    = grossRevenue - salesTaxTotal;
  const totalProfit   = netRevenue - investment;  // = sum.profitQty
  const roi = investment>0 ? (totalProfit/investment*100) : 0;
  const roiStr = (roi>=0?'+':'')+roi.toFixed(1)+'%';
  const g = totalProfit >= 0;

  return`<div class="sum-card">
    <div class="sum-lines">
      <div class="sum-line">
        <span class="sum-line-lbl">${pl?'Koszt materiałów':'Material cost'}</span>
        <span class="sum-line-val" style="color:var(--red)">−${f(matCostTotal)} 💰</span>
      </div>
      <div class="sum-line">
        <span class="sum-line-lbl">${pl?'Cena bazowych itemów':'Base item cost'}</span>
        <span class="sum-line-val" style="color:var(--red)">−${f(baseCostTotal)} 💰</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;background:rgba(100,149,237,.1);border:1px solid rgba(100,149,237,.25);border-radius:8px;padding:8px 12px;margin:4px 0">
        <span style="flex:1;font-size:.82rem;font-weight:700;color:#7aaeff">${pl?'🔨 Koszt enchantu (item + mat.)':'🔨 Enchant cost (item + mats)'}</span>
        <span style="font-size:.95rem;font-weight:700;color:#7aaeff">−${f(matCostTotal+baseCostTotal)} 💰</span>
      </div>
      ${setupFeeTotal>0?`<div class="sum-line">
        <span class="sum-line-lbl">${pl?`Podatek wystawienia (${state.settings.setupFee}%)`:`Listing fee (${state.settings.setupFee}%)`}</span>
        <span class="sum-line-val" style="color:var(--red)">−${f(setupFeeTotal)} 💰</span>
      </div>`:''}
      <div class="sum-sep"></div>
      <div class="sum-invest">
        <span style="flex:1;font-size:.9rem;font-weight:700;color:var(--muted)">${pl?'💸 INWESTYCJA':'💸 INVESTMENT'}</span>
        <span style="font-size:1.05rem;font-weight:700;color:var(--red)">${f(investment)} 💰</span>
      </div>
      <div class="sum-line" style="margin-top:6px;opacity:.8">
        <span class="sum-line-lbl" style="font-size:.8rem">${pl?`Podatek od sprzedaży (${state.premium?state.settings.taxPrem:state.settings.taxNoPrem}%) – potrącany z przychodu`:`Sales tax (${state.premium?state.settings.taxPrem:state.settings.taxNoPrem}%) – deducted from revenue`}</span>
        <span class="sum-line-val" style="color:var(--muted);font-size:.85rem">−${f(salesTaxTotal)} 💰</span>
      </div>
    </div>
    <div class="sum-profit-box ${g?'good':'bad'}" style="margin-top:6px">
      <div>
        <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px">${pl?'ZAROBEK CAŁKOWITY':'TOTAL PROFIT'}</div>
        <span class="sum-profit-big ${g?'pg':'pb'}">${fp(totalProfit)} 💰</span>
        <span style="color:var(--muted);font-size:.82rem;margin-left:6px">${fp(sum.profit)} 💰 ${pl?'/ szt.':'/ unit'}</span>
        <span style="display:inline-block;margin-left:10px;padding:3px 10px;border-radius:8px;font-size:.82rem;font-weight:700;background:${g?'rgba(76,175,80,.15)':'rgba(244,67,54,.15)'};border:1px solid ${g?'rgba(76,175,80,.4)':'rgba(244,67,54,.4)'};color:${g?'var(--green)':'var(--red)'}">${pl?'ROI':'ROI'}: ${roiStr}</span>
      </div>
      <span class="verdict ${g?'vy':'vn'}" style="font-size:.88rem;padding:5px 16px">${g?t('s_yes'):t('s_no')}</span>
      ${sum.hasDailyVol&&sum.recDaily?`<span class="sum-daily">${t('s_daily')} <strong style="color:var(--gold)">${sum.recDaily}</strong>${t('s_per_day')}</span>`:''}
    </div>
    <div class="sum-act-row">
      <button class="btn-add-sum${item.inSummary?' on':''}" data-togglesum="${item.id}">${item.inSummary?t('btn_in_sum'):t('btn_add_sum')}</button>
      ${item.inSummary?`<button class="btn-to-market" data-tomarket="${item.id}">🏪 ${t('btn_to_market')}</button>`:''}
      ${item.inSummary&&sum?(()=>{
        const pl=state.lang==='pl';
        const ti=ITEM_TYPE_KEYS[item.type]||ITEM_TYPE_KEYS['1h'];
        const baseIconUrl=itemIconUrl(item);
        const iconH=baseIconUrl
          ?`<img src="${esc(baseIconUrl)}" style="width:22px;height:22px;object-fit:contain;vertical-align:middle" alt="" onerror="this.style.display='none'">`

// ══════════ ITEM DATABASE (GitHub CDN, CORS enabled) ══════════
let _itemDB=null,_itemDBLoading=false,_itemDBWaiters=[];
async function getItemDB(){
  if(_itemDB)return _itemDB;
  if(_itemDBLoading)return new Promise(res=>_itemDBWaiters.push(res));
  _itemDBLoading=true;
  const sources=[
    'https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/formatted/items.json',
    'https://raw.githubusercontent.com/broderickhyman/ao-bin-dumps/master/formatted/items.json',
  ];
  let raw=null;
  for(const url of sources){
    try{const r=await fetch(url);if(r.ok){raw=await r.json();break;}}catch(_){}
  }
  _itemDB={};
  if(Array.isArray(raw)){
    raw.forEach(item=>{
      if(!item.UniqueName||!item.LocalizedNames)return;
      if(item.UniqueName.includes('@'))return; // skip enchanted variants – only base items
      const en=(item.LocalizedNames['EN-US']||'').trim();
      const pl=(item.LocalizedNames['PL-PL']||'').trim();
      if(!en&&!pl)return;
      _itemDB[item.UniqueName]={en,pl};
    });
  }
  _itemDBLoading=false;
  _itemDBWaiters.forEach(fn=>fn(_itemDB));
  _itemDBWaiters=[];
  return _itemDB;
}

// ══════════ SEARCH AUTOCOMPLETE ══════════
const _sTimers={};

async function triggerSearch(inp,itemId){
  const query=inp.value.trim();
  const dd=document.getElementById(`sdd-${itemId}`);
  if(!dd)return;
  if(query.length<2){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML=`<div class="sdd-msg">${t('search_searching')}</div>`;
  clearTimeout(_sTimers[itemId]);
  _sTimers[itemId]=setTimeout(async()=>{
    const item=getItems().find(i=>i.id===itemId);
    if(!item)return;
    if(!_itemDB)dd.innerHTML=`<div class="sdd-msg">${t('search_loading')}</div>`;
    const db=await getItemDB();
    if(!db||!Object.keys(db).length){
      dd.innerHTML=`<div class="sdd-msg">${t('search_err')}</div>`;return;
    }
    const q=query.toLowerCase();
    const tierPfx=item.tier+'_';
    // Collect ALL matches (no early break), search both en + pl
    const hits=[];
    for(const [uname,names] of Object.entries(db)){
      if(!uname.startsWith(tierPfx))continue;
      const en=(names.en||'').toLowerCase();
      const pl=(names.pl||'').toLowerCase();
      if(!en.includes(q)&&!pl.includes(q))continue;
      const display=state.lang==='pl'?(names.pl||names.en||uname):(names.en||names.pl||uname);
      const score=(en.startsWith(q)||pl.startsWith(q))?2:
                  (en.includes(' '+q)||pl.includes(' '+q))?1:0;
      hits.push({uname,display,score});
    }
    if(!hits.length){dd.innerHTML=`<div class="sdd-msg">${t('search_none')}</div>`;return;}
    hits.sort((a,b)=>b.score-a.score||a.display.localeCompare(b.display,'pl'));
    dd.innerHTML=hits.slice(0,16).map(h=>{
      const iUrl=`https://render.albiononline.com/v1/item/${encodeURIComponent(h.uname)}.png`;
      return`<div class="sdd-item" data-pick="${esc(h.uname)}" data-dname="${esc(h.display)}" data-iid="${itemId}">
        <img src="${iUrl}" alt="" onerror="this.style.display='none'">
        <span class="sdd-name">${esc(h.display)}</span>
      </div>`;
    }).join('');
    dd.querySelectorAll('.sdd-item').forEach(el=>el.addEventListener('mousedown',e=>{
      e.preventDefault();
      const uniqueName=el.dataset.pick,dname=el.dataset.dname,iid=+el.dataset.iid;
      const base=uniqueName.replace(/^T\d+_/,'');
      const autoType=guessItemType(uniqueName);
      let pickedItem=null;
      setItem(iid,it=>{
        it.name=dname;
        it.uniqueBaseName=base;
        it.type=autoType;
        it.icon=itemIconUrl(it); // respects current tier + rangeFrom
        it.iconIsUrl=true;
        pickedItem=it;
      });
      inp.value=dname;
      dd.style.display='none';
      // Full card rebuild since type may have changed
      if(pickedItem)rebuildCard(pickedItem);
      else save();
    }));
  },350);
}

// ══════════ LISTING / SELLING ══════════
function createListing(itemId){
  const item=getItems().find(i=>i.id===itemId);if(!item)return;
  const mats=getMats();
  const sum=calcSummary(item,mats);
  const ti=ITEM_TYPE_KEYS[item.type]||ITEM_TYPE_KEYS['1h'];
  const to=+item.rangeTo;
  const fee=sum&&item.sellOrder?sum.sp*(state.settings.setupFee/100)*sum.qty:0;
  state.listings.push({
    id:nextListingId++,
    listedAt:Date.now(),
    itemId,
    city:state.activeCity,
    name:item.name||tType(item.type),
    tier:item.tier,
    enc:ENC[to],
    sp:sum?sum.sp:0,
    qty:sum?sum.qty:(parseInt(item.qty)||1),
    profit:sum?sum.profitQty:0,
    investment:sum?sum.totalMC*sum.qty+sum.bp*sum.qty+fee:0,
    iconUrl:itemFinalIconUrl(item)||(item.iconIsUrl?item.icon:null),
    emoji:!item.iconIsUrl?(item.icon||ti.emoji):null,
  });
  // Remove from summary – item is now in "awaiting" state
  setItem(itemId,it=>{it.inSummary=false;});
  save();render();
}

function soldListing(lid){
  const l=state.listings.find(x=>listingIdMatch(x.id,lid));if(!l)return;
  state.salesHistory.push({id:l.id,soldAt:Date.now(),listedAt:l.listedAt,name:l.name,tier:l.tier,enc:l.enc,profit:l.profit,qty:l.qty,city:l.city||null});
  state.listings=state.listings.filter(x=>!listingIdMatch(x.id,lid));
  // uncheck inSummary on the source item
  setItem(l.itemId,it=>{it.inSummary=false;});
  save();render();
}

// Returns the correct icon URL for an item considering tier + rangeFrom enchant level
function itemIconUrl(item){
  if(!item.uniqueBaseName)return null;
  const enc=(+item.rangeFrom)>0?`@${item.rangeFrom}`:'';
  return`https://render.albiononline.com/v1/item/${encodeURIComponent(item.tier+'_'+item.uniqueBaseName+enc)}.png`;
}
// Final product icon (target enchant / rangeTo) — for summary display
function itemFinalIconUrl(item){
  if(!item.uniqueBaseName)return item.iconIsUrl&&item.icon?item.icon:null;
  const enc=(+item.rangeTo)>0?`@${item.rangeTo}`:'';
  return`https://render.albiononline.com/v1/item/${encodeURIComponent(item.tier+'_'+item.uniqueBaseName+enc)}.png`;
}

// Auto-detect item type from Albion unique name
function guessItemType(uname){
  const b=uname.replace(/^T\d+_/,'');
  if(b.startsWith('2H_'))return '2h';
  if(b.startsWith('GATHERER_HEADGEAR')||b.startsWith('GATHERER_HEAD'))return 'g_helm';
  if(b.startsWith('GATHERER_ARMOR'))return 'g_armor';
  if(b.startsWith('GATHERER_SHOES'))return 'g_boots';
  if(b.startsWith('GATHERER_BACKPACK'))return 'g_bag';
  if(b.startsWith('HEAD_'))return 'helm';
  if(b.startsWith('ARMOR_'))return 'armor';
  if(b.startsWith('SHOES_'))return 'boots';
  if(b.startsWith('BAG'))return 'bag';
  if(b.startsWith('CAPE'))return 'cape';
  if(b.startsWith('OFF_'))return 'offhand';
  // 1H: MAIN_*, single staffs, daggers, etc.
  return '1h';
}

function handleF(el){
  const parts=el.dataset.f.split('-'),id=+parts[0],field=parts.slice(1).join('-');
  let item=null;setItem(id,i=>{item=i;});if(!item)return;
  let needCard=false;
  switch(field){
    case 'name':      item.name=el.value;save();return;
    case 'quality':   item.quality=el.value;break;
    case 'sellOrder': item.sellOrder=el.checked;
      {const btn=el.closest('.so-btn');if(btn)btn.classList.toggle('on',item.sellOrder);}
      break;
    case 'qty':       item.qty=parseInt(el.value)||1;break;
    case 'dailyVol':  item.dailyVol=el.value;break;
    case 'p0': item.prices.p0=el.value;break;
    case 'p1': item.prices.p1=el.value;break;
    case 'p2': item.prices.p2=el.value;break;
    case 'p3': item.prices.p3=el.value;break;
    case 'type': item.type=el.value;needCard=true;break;
    case 'tier': item.tier=el.value;
      if(item.uniqueBaseName){item.icon=itemIconUrl(item);item.iconIsUrl=true;}
      needCard=true;break;
    case 'rangeFrom': item.rangeFrom=+el.value;
      if(+item.rangeTo<=+item.rangeFrom)item.rangeTo=Math.min(3,+item.rangeFrom+1);
      if(item.uniqueBaseName){item.icon=itemIconUrl(item);item.iconIsUrl=true;}
      needCard=true;break;
    case 'rangeTo': item.rangeTo=+el.value;needCard=true;break;
  }
  if(needCard){rebuildCard(item);return;}
  refreshOne(item);save();
}

    return;
  }
  if(isIpBanned(ip)){
    if(s){s.style.color='var(--red)';s.textContent=t('gm_banned');}
    if(btn)btn.disabled=false;
    return;
  }
  const gate=await verifyLoginAllowed(nick,ip);
  if(!gate.ok){
    if(s){s.style.color='var(--red)';s.textContent=t(gate.msg||'gm_login_verify_fail');}
    if(btn)btn.disabled=false;
    return;
  }
  if(!gate.existing){
    const reg=await registerGuildUser(nick,ip,guildTag);
    if(!reg.ok){
      if(s){s.style.color='var(--red)';s.textContent=t(reg.msg||'gm_login_verify_fail');}
      if(btn)btn.disabled=false;
      return;
    }
  }else{
    await touchGuildUser(nick,ip,guildTag);
  }
  const rowAfter=await fetchGuildUserRow(`nick_key=eq.${encodeURIComponent(nickKey(nick))}`);
  if(!rowAfter){
    if(s){s.style.color='var(--red)';s.textContent=t('gm_rls_block');}
    if(btn)btn.disabled=false;
    return;
  }
  if(rowAfter.ip!==ip){
    if(s){s.style.color='var(--red)';s.textContent=t('gm_login_nick_taken');}
    if(btn)btn.disabled=false;
    return;
  }
  persistProfile(nick,guildTag);
  const ov=document.getElementById('login-overlay');
  if(ov)ov.remove();
  await loadGuildMarket();
  render();
  updateNickDisplay();
}

function updateNickDisplay(){
  const el=document.getElementById('nick-display');
  if(!el||!cloudNick)return;
  // Insert nick text before the logout button
  let span=el.querySelector('.nick-txt');
  if(!span){span=document.createElement('span');span.className='nick-txt';el.insertBefore(span,el.firstChild);}
  span.textContent='👤 '+formatListingNick({nick:cloudNick,guild_tag:cloudGuildTag});
  el.style.display='flex';
}

function logout(){
  const pl=state.lang==='pl';
  if(!confirm(pl?'Wylogować się? (bez nicku nie dodasz ogłoszeń)':'Log out? (you need a nick to post listings)'))return;
  localStorage.removeItem('ao_nick');
  cloudNick=null;
  cloudGuildTag=(localStorage.getItem('ao_guild_tag')||'').trim();
  // Show login overlay
  document.body.insertAdjacentHTML('beforeend',buildLoginModal());
  bindLoginModal();
}

function bindLoginModal(){
  const inp=document.getElementById('nick-input');
  const btn=document.getElementById('nick-confirm');
  if(inp){
    inp.focus();
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const tg=document.getElementById('guild-tag-input');
        doLogin(inp.value,tg?tg.value:'');
      }
    });
    inp.addEventListener('input',()=>{
      const s=document.getElementById('nick-status');
      if(s)s.textContent='';
    });
  }
  if(btn)btn.addEventListener('click',()=>{
    const tg=document.getElementById('guild-tag-input');
    doLogin(inp?inp.value:'',tg?tg.value:'');
  });
}

// ══════════ INIT ══════════
try{
if(ensureFreshHtmlVersion()){/* reload */}else{
loadPrefs();
(async()=>{
  await Promise.all([loadGuildMarket(),loadGuildBans()]);
  if(cloudNick&&isNickBanned(cloudNick)){
    localStorage.removeItem('ao_nick');
    cloudNick=null;
    document.body.insertAdjacentHTML('beforeend',buildLoginModal());
    bindLoginModal();
    const s=document.getElementById('nick-status');
    if(s){s.style.color='var(--red)';s.textContent=t('gm_banned');}
  }else if(cloudNick&&!(await verifyCurrentSession())){
    localStorage.removeItem('ao_nick');
    cloudNick=null;
    document.body.insertAdjacentHTML('beforeend',buildLoginModal());
    bindLoginModal();
    const s=document.getElementById('nick-status');
    if(s){s.style.color='var(--red)';s.textContent=t('gm_session_invalid');}
  }
  getItemDB().then(()=>render());
  render();
  if(cloudNick){
    await ensureGuildUserProfile();
    updateNickDisplay();
  } else if(!document.getElementById('login-overlay')) {
    document.body.insertAdjacentHTML('beforeend',buildLoginModal());
    bindLoginModal();
  }
})();
}
}catch(err){
  console.error(err);
  document.body.innerHTML='<div style="max-width:520px;margin:40px auto;padding:24px;background:#1a1a2e;border:2px solid #c9a84c;border-radius:12px;color:#e8e8f0;font-family:sans-serif"><h2 style="color:#ffd700;margin:0 0 12px">Błąd ładowania</h2><p style="margin:0 0 10px">Rynek gildii nie mógł się uruchomić. Odśwież stronę (Ctrl+Shift+R).</p><p style="margin:0;font-size:.85rem;color:#aaa">'+String(err&&err.message||err)+'</p></div>';
}

window.addEventListener('pageshow',e=>{
  if(e.persisted)loadGuildMarket().then(()=>render());
});
window.addEventListener('scroll',()=>{
  const scrolled=window.scrollY>300;
  const atBottom=window.scrollY+window.innerHeight>=document.body.scrollHeight-100;
  const btnT=document.getElementById('btn-top');
  const btnB=document.getElementById('btn-bot');
  if(btnT)btnT.classList.toggle('vis',scrolled);
  if(btnB)btnB.classList.toggle('vis',!atBottom&&document.body.scrollHeight>window.innerHeight+200);
},{passive:true});
</script>
